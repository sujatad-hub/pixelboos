<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    
    <link rel="stylesheet" href="../css/titlebar.css">
    <link rel="stylesheet" href="../css/character.css">
</head>
<body>
    <div class="container">

        <!--custom titlebar-->
        <div class="titlebar">
            <button id="minimize" class="window-btn">-</button>
            <button id="close" class="window-btn">x</button>
        </div>

    <div class="choosec">choose your <br> character:</div> 
    <div class="selector">
        <button id="left"><</button>
    <div class="viewport">
        <div class="slider" id="slider">

            <div class="character">
                <img class="jiji" src="../assets/jiji.png">
                <p>jiji</p>
            </div>
            
             <div class="character">
                <img src="../assets/pecko.png">
                <p>pecko</p>
            </div>
            
            <div class="character">
                <img src="../assets/snoopy.png">
                <p>snoopy</p>
            </div>
            <div class="character">
                 <img src="../assets/todd.png">
                 <p>todd</p>
            </div>
        </div>
    </div>
    <button id="right">></button>
</div>
<button id="select">Select</button>
<p class="characters" id="message"></p>

<button id="game" class="game"> ←</button>
</div>
  
<Script src="../js/titlebar.js"></Script>
<script src="../js/character.js"></script>
</body>
</html>
