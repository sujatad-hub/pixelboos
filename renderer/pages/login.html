<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial scale=1.0">
        <link rel="stylesheet" href="../css/titlebar.css">
        <link rel="stylesheet" href="../css/index.css">
        <script src="../js/index.js"></script>
        <title></title>
</head>
<body>
    <div class="container">

        <!--custom titlebar-->
        <div class="titlebar">
            <button id="minimize" class="window-btn">-</button>
            <button id="close" class="window-btn">x</button>
        </div>


        <form id="loginForm">
            <div id="uname">username:</div>
            <input type="text" id="username" required />

            <div id="pname">password:</div>
            <input type="password" id="password" required />
            <button type="submit" id="login-btn">Login</button>
            <p id="message"></p>
        </form>

        

        <p id="s">Don't have an account? <br><a href="signup.html">click here to create one</a></p>
    </div>
    <script src="../js/titlebar.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
